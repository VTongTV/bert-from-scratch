<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="ft-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <filter id="ft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#212121"/>
  <!-- title -->
  <rect x="48" y="24" width="1184" height="48" rx="4" fill="#C62828" opacity="0.15"/>
  <text x="640" y="56" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#FAFAFA">Fine-Tuning Heads — Same Encoder, Different Task Outputs</text>
  <!-- legend -->
  <rect x="48" y="648" width="1184" height="48" rx="4" fill="#424242" opacity="0.4"/>
  <rect x="72" y="664" width="16" height="16" rx="2" fill="#424242" stroke="#C62828" stroke-width="1.5"/>
  <text x="96" y="678" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#FAFAFA">Shared BERT encoder</text>
  <rect x="300" y="664" width="16" height="16" rx="2" fill="#B71C1C"/>
  <text x="324" y="678" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#FAFAFA">Task-specific head</text>
  <text x="520" y="678" font-family="monospace" font-size="11" fill="#9E9E9E">W ∈ R^{K×H} — only new params</text>
  <!-- shared BERT encoder -->
  <rect x="48" y="120" width="200" height="480" rx="8" fill="#424242" stroke="#C62828" stroke-width="2"/>
  <text x="148" y="300" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#FAFAFA">BERT</text>
  <text x="148" y="324" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#FAFAFA">Encoder</text>
  <text x="148" y="360" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9E9E9E">L=12, H=768</text>
  <text x="148" y="384" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9E9E9E">A=12, d_ff=3072</text>
  <text x="148" y="420" text-anchor="middle" font-family="monospace" font-size="11" fill="#C62828">~110M params</text>
  <text x="148" y="460" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9E9E9E">Same weights</text>
  <text x="148" y="476" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9E9E9E">across all tasks</text>
  <!-- GLUE branch -->
  <line x1="248" y1="200" x2="360" y2="200" stroke="#C62828" stroke-width="2"/>
  <rect x="360" y="140" width="260" height="120" rx="6" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="490" y="168" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#C62828">GLUE</text>
  <text x="490" y="192" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">Input: [CLS] Sentence_A [SEP] Sentence_B</text>
  <text x="490" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">Head: Dense→tanh→Dropout→Linear</text>
  <text x="490" y="232" text-anchor="middle" font-family="monospace" font-size="11" fill="#B71C1C">W ∈ R^{K×H}, K = num_labels</text>
  <text x="490" y="252" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9E9E9E">batch=32, lr=2e-5, 3 epochs</text>
  <!-- SQuAD branch -->
  <line x1="248" y1="360" x2="360" y2="360" stroke="#C62828" stroke-width="2"/>
  <rect x="360" y="290" width="260" height="140" rx="6" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="490" y="318" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#C62828">SQuAD v1.1 / v2.0</text>
  <text x="490" y="342" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">Input: [CLS] Question [SEP] Passage</text>
  <text x="490" y="362" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">Head: S∈R^H, E∈R^H (start/end vectors)</text>
  <text x="490" y="382" text-anchor="middle" font-family="monospace" font-size="10" fill="#B71C1C">P_i = softmax(S·T_i), span: j≥i</text>
  <text x="490" y="402" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9E9E9E">v1.1: batch=32, lr=5e-5, 3 ep</text>
  <text x="490" y="420" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9E9E9E">v2.0: batch=48, lr=5e-5, 2 ep + null</text>
  <!-- SWAG branch -->
  <line x1="248" y1="520" x2="360" y2="520" stroke="#C62828" stroke-width="2"/>
  <rect x="360" y="460" width="260" height="120" rx="6" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="490" y="488" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#C62828">SWAG</text>
  <text x="490" y="512" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">Input: 4× [CLS] Sent_A [SEP] Choice_i</text>
  <text x="490" y="532" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">Head: vector·[CLS] → softmax over 4</text>
  <text x="490" y="552" text-anchor="middle" font-family="monospace" font-size="11" fill="#B71C1C">score = W·C, W∈R^H</text>
  <text x="490" y="572" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9E9E9E">batch=16, lr=2e-5, 3 epochs</text>
  <!-- results column -->
  <rect x="720" y="120" width="520" height="500" rx="8" fill="#424242" stroke="#616161" stroke-width="1" opacity="0.5"/>
  <text x="980" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#C62828">Paper Results (BERT_LARGE)</text>
  <!-- GLUE results -->
  <text x="740" y="186" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#FAFAFA">GLUE Average: 82.1</text>
  <text x="740" y="206" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9E9E9E">+7.0 over prior SOTA (OpenAI GPT: 75.1)</text>
  <text x="740" y="226" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9E9E9E">MNLI 86.7 | QQP 72.1 | QNLI 92.7 | SST-2 94.9</text>
  <text x="740" y="244" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9E9E9E">CoLA 60.5 | STS-B 86.5 | MRPC 89.3 | RTE 70.1</text>
  <!-- SQuAD results -->
  <text x="740" y="280" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#FAFAFA">SQuAD v1.1: 90.9 F1 / 84.1 EM</text>
  <text x="740" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9E9E9E">+1.5 F1 over prior #1 ensemble</text>
  <text x="740" y="330" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#FAFAFA">SQuAD v2.0: 83.1 F1 / 80.0 EM</text>
  <text x="740" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9E9E9E">+5.1 F1 over prior best single model</text>
  <!-- SWAG results -->
  <text x="740" y="386" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#FAFAFA">SWAG: 86.3% accuracy</text>
  <text x="740" y="406" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9E9E9E">+8.3% over OpenAI GPT, beats human expert (85.0%)</text>
  <!-- fine-tuning detail box -->
  <rect x="740" y="440" width="480" height="160" rx="6" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="760" y="468" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#C62828">Fine-Tuning Procedure</text>
  <text x="760" y="492" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">1. Load pre-trained BERT checkpoint</text>
  <text x="760" y="512" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">2. Add task-specific classification head (random init)</text>
  <text x="760" y="532" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">3. Fine-tune all parameters end-to-end</text>
  <text x="760" y="552" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">4. Search lr over {5e-5, 4e-5, 3e-5, 2e-5}</text>
  <text x="760" y="572" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9E9E9E">BERT_LARGE: random restarts on small datasets</text>
</svg>
