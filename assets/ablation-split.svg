<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="as-split-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <filter id="as-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#1A1A1A"/>
  <!-- title -->
  <rect x="48" y="16" width="1184" height="44" rx="4" fill="#212121"/>
  <text x="640" y="46" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="#E8E8E8">Ablation Study — Body Split Variants</text>
  <!-- legend -->
  <rect x="48" y="664" width="1184" height="40" rx="4" fill="#212121"/>
  <rect x="72" y="676" width="16" height="16" rx="2" fill="url(#as-split-grad)"/>
  <text x="96" y="689" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9E9E9E">BERT (full)</text>
  <rect x="200" y="676" width="16" height="16" rx="2" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="224" y="689" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9E9E9E">Ablated variant</text>
  <line x1="380" y1="684" x2="440" y2="684" stroke="#C62828" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="448" y="689" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9E9E9E">Split path</text>

  <!-- ===== CENTRAL BODY (BERT_BASE full) ===== -->
  <rect id="as-body" x="80" y="160" width="120" height="400" rx="8" fill="url(#as-split-grad)" stroke="#C62828" stroke-width="2"/>
  <text x="140" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#E8E8E8">BERT</text>
  <text x="140" y="340" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#E8E8E8">BASE</text>
  <text x="140" y="368" text-anchor="middle" font-family="monospace" font-size="11" fill="#FFCDD2">L=12</text>
  <text x="140" y="386" text-anchor="middle" font-family="monospace" font-size="11" fill="#FFCDD2">H=768</text>
  <text x="140" y="404" text-anchor="middle" font-family="monospace" font-size="11" fill="#FFCDD2">A=12</text>
  <text x="140" y="440" text-anchor="middle" font-family="monospace" font-size="10" fill="#E8E8E8">MLM+NSP</text>

  <!-- ===== SPLIT LINES (body parts fly apart) ===== -->
  <!-- 4 ablation variants split out from the center -->
  <!-- Each has a draw-on path from the body to its position -->

  <!-- Path to No NSP -->
  <path id="as-split1" d="M200,280 L400,180" fill="none" stroke="#C62828" stroke-width="2" pathLength="100" stroke-dasharray="100"/>
  <!-- Path to LTR -->
  <path id="as-split2" d="M200,360 L400,360" fill="none" stroke="#C62828" stroke-width="2" pathLength="100" stroke-dasharray="100"/>
  <!-- Path to LTR + BiLSTM -->
  <path id="as-split3" d="M200,440 L400,540" fill="none" stroke="#C62828" stroke-width="2" pathLength="100" stroke-dasharray="100"/>
  <!-- Path to Small model -->
  <path id="as-split4" d="M200,520 L400,640 L700,640" fill="none" stroke="#C62828" stroke-width="2" pathLength="100" stroke-dasharray="100"/>

  <!-- ===== ABLATION 1: No NSP ===== -->
  <g>
    <g transform="translate(490,180)">
      <rect x="-80" y="-60" width="160" height="120" rx="8" fill="#424242" stroke="#616161" stroke-width="1.5">
        <animateTransform attributeName="transform" type="scale" values="1,0;1,1;1,1;1,0" keyTimes="0;0.3;0.75;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="490" y="168" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#E8E8E8">No NSP</text>
    <text x="490" y="188" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">MLM only</text>
    <text x="490" y="210" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#FF8A65">↓ QNLI, MNLI</text>
    <text x="490" y="228" text-anchor="middle" font-family="monospace" font-size="10" fill="#616161">SQuAD: 87.5→84.9</text>
  </g>

  <!-- ===== ABLATION 2: LTR (Left-to-Right) ===== -->
  <g>
    <g transform="translate(490,360)">
      <rect x="-80" y="-60" width="160" height="120" rx="8" fill="#424242" stroke="#616161" stroke-width="1.5">
        <animateTransform attributeName="transform" type="scale" values="1,0;1,1;1,1;1,0" keyTimes="0;0.35;0.75;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="490" y="348" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#E8E8E8">LTR</text>
    <text x="490" y="368" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">No NSP</text>
    <text x="490" y="390" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#FF8A65">↓↓ All tasks</text>
    <text x="490" y="408" text-anchor="middle" font-family="monospace" font-size="10" fill="#616161">MRPC: 86.7→77.5</text>
  </g>

  <!-- ===== ABLATION 3: LTR + BiLSTM ===== -->
  <g>
    <g transform="translate(490,540)">
      <rect x="-80" y="-60" width="160" height="120" rx="8" fill="#424242" stroke="#616161" stroke-width="1.5">
        <animateTransform attributeName="transform" type="scale" values="1,0;1,1;1,1;1,0" keyTimes="0;0.4;0.75;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="490" y="528" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#E8E8E8">LTR + BiLSTM</text>
    <text x="490" y="548" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">shallow merge</text>
    <text x="490" y="570" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#FF8A65">↑ vs LTR alone</text>
    <text x="490" y="588" text-anchor="middle" font-family="monospace" font-size="10" fill="#616161">SQuAD: 79.5→84.9</text>
  </g>

  <!-- ===== MASKING STRATEGY TABLE (smaller, right side) ===== -->
  <text x="820" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#E8E8E8">Masking Strategy</text>

  <!-- Table header -->
  <rect x="680" y="112" width="280" height="28" rx="4" fill="#424242"/>
  <text x="760" y="132" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#E8E8E8">Strategy</text>
  <text x="890" y="132" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#E8E8E8">SQuAD F1</text>

  <!-- Row 1: 80/10/10 (BERT default) -->
  <rect x="680" y="144" width="280" height="28" rx="2" fill="#B71C1C" opacity="0.8"/>
  <text x="760" y="164" text-anchor="middle" font-family="monospace" font-size="11" fill="#E8E8E8">80/10/10</text>
  <text x="890" y="164" text-anchor="middle" font-family="monospace" font-size="11" fill="#E8E8E8">88.5</text>

  <!-- Row 2: 100% mask -->
  <rect x="680" y="176" width="280" height="28" rx="2" fill="#2A2A2A"/>
  <text x="760" y="196" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">100/0/0</text>
  <text x="890" y="196" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">86.4</text>

  <!-- Row 3: 80/0/20 -->
  <rect x="680" y="208" width="280" height="28" rx="2" fill="#2A2A2A"/>
  <text x="760" y="228" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">80/0/20</text>
  <text x="890" y="228" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">87.6</text>

  <!-- Row 4: 80/20/0 -->
  <rect x="680" y="240" width="280" height="28" rx="2" fill="#2A2A2A"/>
  <text x="760" y="260" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">80/20/0</text>
  <text x="890" y="260" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">87.8</text>

  <!-- ===== MODEL SIZE TABLE (right side, lower) ===== -->
  <text x="820" y="340" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#E8E8E8">Model Size</text>

  <rect x="680" y="352" width="280" height="28" rx="4" fill="#424242"/>
  <text x="720" y="372" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#E8E8E8">L</text>
  <text x="760" y="372" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#E8E8E8">H</text>
  <text x="800" y="372" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#E8E8E8">A</text>
  <text x="890" y="372" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#E8E8E8">MNLI acc</text>

  <!-- L=3 -->
  <rect x="680" y="384" width="280" height="28" rx="2" fill="#2A2A2A"/>
  <text x="720" y="404" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">3</text>
  <text x="760" y="404" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">768</text>
  <text x="800" y="404" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">12</text>
  <text x="890" y="404" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">77.8</text>

  <!-- L=6 -->
  <rect x="680" y="416" width="280" height="28" rx="2" fill="#2A2A2A"/>
  <text x="720" y="436" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">6</text>
  <text x="760" y="436" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">768</text>
  <text x="800" y="436" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">12</text>
  <text x="890" y="436" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">80.4</text>

  <!-- L=12 (BERT_BASE) -->
  <rect x="680" y="448" width="280" height="28" rx="2" fill="#B71C1C" opacity="0.8"/>
  <text x="720" y="468" text-anchor="middle" font-family="monospace" font-size="11" fill="#E8E8E8">12</text>
  <text x="760" y="468" text-anchor="middle" font-family="monospace" font-size="11" fill="#E8E8E8">768</text>
  <text x="800" y="468" text-anchor="middle" font-family="monospace" font-size="11" fill="#E8E8E8">12</text>
  <text x="890" y="468" text-anchor="middle" font-family="monospace" font-size="11" fill="#E8E8E8">84.4</text>

  <!-- H=1024 -->
  <rect x="680" y="480" width="280" height="28" rx="2" fill="#2A2A2A"/>
  <text x="720" y="500" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">12</text>
  <text x="760" y="500" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">1024</text>
  <text x="800" y="500" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">16</text>
  <text x="890" y="500" text-anchor="middle" font-family="monospace" font-size="11" fill="#9E9E9E">86.3</text>

  <!-- ===== BAR CHART: masking strategies as growing bars ===== -->
  <text x="1100" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#E8E8E8">F1 Comparison</text>
  <!-- Baseline line -->
  <line x1="1020" y1="120" x2="1180" y2="120" stroke="#424242" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1016" y="124" text-anchor="end" font-family="monospace" font-size="9" fill="#616161">90</text>

  <!-- Bar: 80/10/10 -->
  <rect x="1030" y="140" width="24" height="0" rx="2" fill="#C62828">
    <animate attributeName="height" values="0;211;211;0" keyTimes="0;0.5;0.75;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y" values="351;140;140;351" keyTimes="0;0.5;0.75;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="1042" y="365" text-anchor="middle" font-family="monospace" font-size="8" fill="#9E9E9E">80/10</text>

  <!-- Bar: 100/0/0 -->
  <rect x="1060" y="140" width="24" height="0" rx="2" fill="#424242" stroke="#616161" stroke-width="1">
    <animate attributeName="height" values="0;199;199;0" keyTimes="0;0.55;0.75;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y" values="351;152;152;351" keyTimes="0;0.55;0.75;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="1072" y="365" text-anchor="middle" font-family="monospace" font-size="8" fill="#616161">100/0</text>

  <!-- Bar: 80/0/20 -->
  <rect x="1090" y="140" width="24" height="0" rx="2" fill="#424242" stroke="#616161" stroke-width="1">
    <animate attributeName="height" values="0;205;205;0" keyTimes="0;0.6;0.75;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y" values="351;146;146;351" keyTimes="0;0.6;0.75;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="1102" y="365" text-anchor="middle" font-family="monospace" font-size="8" fill="#616161">80/0</text>

  <!-- Bar: 80/20/0 -->
  <rect x="1120" y="140" width="24" height="0" rx="2" fill="#424242" stroke="#616161" stroke-width="1">
    <animate attributeName="height" values="0;206;206;0" keyTimes="0;0.65;0.75;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y" values="351;145;145;351" keyTimes="0;0.65;0.75;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="1132" y="365" text-anchor="middle" font-family="monospace" font-size="8" fill="#616161">80/20</text>

  <!-- ===== SPLIT DRAW-ON ANIMATIONS ===== -->
  <animate attributeName="stroke-dashoffset" href="#as-split1" values="100;0;0;100" keyTimes="0;0.25;0.75;1" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="stroke-dashoffset" href="#as-split2" values="100;0;0;100" keyTimes="0;0.3;0.75;1" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="stroke-dashoffset" href="#as-split3" values="100;0;0;100" keyTimes="0;0.35;0.75;1" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="stroke-dashoffset" href="#as-split4" values="100;0;0;100" keyTimes="0;0.4;0.75;1" dur="10s" repeatCount="indefinite"/>
</svg>
