<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="ab-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="ab-gray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#424242"/>
      <stop offset="100%" stop-color="#616161"/>
    </linearGradient>
    <filter id="ab-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#212121"/>
  <!-- title -->
  <rect x="48" y="24" width="1184" height="48" rx="4" fill="#C62828" opacity="0.15"/>
  <text x="640" y="56" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#FAFAFA">Ablation Studies — Pre-training Tasks &amp; Masking Strategies</text>
  <!-- legend -->
  <rect x="48" y="648" width="1184" height="48" rx="4" fill="#424242" opacity="0.4"/>
  <rect x="72" y="664" width="16" height="16" rx="2" fill="#C62828"/>
  <text x="96" y="678" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#FAFAFA">BERT_BASE (full)</text>
  <rect x="240" y="664" width="16" height="16" rx="2" fill="#616161"/>
  <text x="264" y="678" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#FAFAFA">Ablation variant</text>
  <text x="440" y="678" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9E9E9E">Table 6 from paper — dev set accuracy</text>
  <!-- LEFT: Task ablation table -->
  <text x="330" y="110" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#C62828">Effect of Pre-training Tasks (Table 6)</text>
  <!-- header row -->
  <rect x="80" y="130" width="500" height="36" rx="4" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="180" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#FAFAFA">Model</text>
  <text x="310" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#FAFAFA">MNLI-m</text>
  <text x="400" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#FAFAFA">QNLI</text>
  <text x="480" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#FAFAFA">SQuAD</text>
  <!-- BERT_BASE row (highlighted) -->
  <rect x="80" y="170" width="500" height="40" rx="4" fill="#B71C1C" stroke="#C62828" stroke-width="1.5"/>
  <text x="180" y="196" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#FAFAFA">BERT_BASE</text>
  <text x="310" y="196" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#FAFAFA">84.4</text>
  <text x="400" y="196" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#FAFAFA">88.4</text>
  <text x="480" y="196" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#FAFAFA">88.5</text>
  <!-- No NSP row -->
  <rect x="80" y="216" width="500" height="40" rx="4" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="180" y="242" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#FAFAFA">No NSP</text>
  <text x="310" y="242" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">83.9</text>
  <text x="400" y="242" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">84.9</text>
  <text x="480" y="242" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">87.9</text>
  <!-- delta labels -->
  <text x="550" y="242" font-family="monospace" font-size="10" fill="#C62828">-0.5 -3.5 -0.6</text>
  <!-- LTR & No NSP row -->
  <rect x="80" y="262" width="500" height="40" rx="4" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="180" y="288" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#FAFAFA">LTR &amp; No NSP</text>
  <text x="310" y="288" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">82.1</text>
  <text x="400" y="288" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">84.3</text>
  <text x="480" y="288" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">77.8</text>
  <text x="550" y="288" font-family="monospace" font-size="10" fill="#C62828">-2.3 -4.1 -10.7</text>
  <!-- LTR + BiLSTM row -->
  <rect x="80" y="308" width="500" height="40" rx="4" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="180" y="334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#FAFAFA">LTR + BiLSTM</text>
  <text x="310" y="334" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">82.1</text>
  <text x="400" y="334" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">84.1</text>
  <text x="480" y="334" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">84.9</text>
  <text x="550" y="334" font-family="monospace" font-size="10" fill="#9E9E9E">BiLSTM helps SQuAD, hurts GLUE</text>
  <!-- key takeaway -->
  <rect x="80" y="370" width="500" height="60" rx="6" fill="#424242" stroke="#C62828" stroke-width="1"/>
  <text x="330" y="394" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#C62828">Key findings:</text>
  <text x="330" y="416" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">NSP helps QNLI (+3.5). Bidirectionality is critical for SQuAD (-10.7).</text>
  <!-- RIGHT: Masking strategy ablation -->
  <text x="920" y="110" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#C62828">Masking Strategy Ablation (Table 9)</text>
  <!-- header -->
  <rect x="680" y="130" width="440" height="36" rx="4" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="750" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#FAFAFA">Mask/Same/Rnd</text>
  <text x="880" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#FAFAFA">MNLI</text>
  <text x="970" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#FAFAFA">NER</text>
  <text x="1060" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#FAFAFA">NER-FB</text>
  <!-- rows -->
  <rect x="680" y="170" width="440" height="36" rx="4" fill="#B71C1C" stroke="#C62828" stroke-width="1.5"/>
  <text x="750" y="194" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#FAFAFA">80/10/10</text>
  <text x="880" y="194" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#FAFAFA">84.2</text>
  <text x="970" y="194" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#FAFAFA">95.4</text>
  <text x="1060" y="194" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#FAFAFA">94.9</text>
  <rect x="680" y="212" width="440" height="36" rx="4" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="750" y="236" text-anchor="middle" font-family="monospace" font-size="12" fill="#FAFAFA">100/0/0</text>
  <text x="880" y="236" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">84.3</text>
  <text x="970" y="236" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">94.9</text>
  <text x="1060" y="236" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">94.0</text>
  <rect x="680" y="254" width="440" height="36" rx="4" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="750" y="278" text-anchor="middle" font-family="monospace" font-size="12" fill="#FAFAFA">80/0/20</text>
  <text x="880" y="278" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">84.1</text>
  <text x="970" y="278" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">95.2</text>
  <text x="1060" y="278" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">94.6</text>
  <rect x="680" y="296" width="440" height="36" rx="4" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="750" y="320" text-anchor="middle" font-family="monospace" font-size="12" fill="#FAFAFA">80/20/0</text>
  <text x="880" y="320" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">84.4</text>
  <text x="970" y="320" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">95.2</text>
  <text x="1060" y="320" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">94.7</text>
  <rect x="680" y="338" width="440" height="36" rx="4" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="750" y="362" text-anchor="middle" font-family="monospace" font-size="12" fill="#FAFAFA">0/20/80</text>
  <text x="880" y="362" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">83.7</text>
  <text x="970" y="362" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">94.8</text>
  <text x="1060" y="362" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">94.6</text>
  <rect x="680" y="380" width="440" height="36" rx="4" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="750" y="404" text-anchor="middle" font-family="monospace" font-size="12" fill="#FAFAFA">0/0/100</text>
  <text x="880" y="404" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">83.6</text>
  <text x="970" y="404" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">94.9</text>
  <text x="1060" y="404" text-anchor="middle" font-family="monospace" font-size="13" fill="#9E9E9E">94.6</text>
  <!-- takeaway -->
  <rect x="680" y="430" width="440" height="60" rx="6" fill="#424242" stroke="#C62828" stroke-width="1"/>
  <text x="900" y="454" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#C62828">Key finding:</text>
  <text x="900" y="476" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">80/10/10 masking is best for feature-based NER.</text>
  <text x="900" y="494" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9E9E9E">All-mask (100/0/0) is competitive on MNLI.</text>
  <!-- NER feature-based -->
  <rect x="80" y="460" width="540" height="170" rx="6" fill="#424242" stroke="#616161" stroke-width="1"/>
  <text x="350" y="490" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#C62828">NER Feature-Based Comparison (CoNLL-2003, dev F1)</text>
  <text x="180" y="520" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9E9E9E">Embeddings only:</text>
  <text x="360" y="520" font-family="monospace" font-size="12" fill="#9E9E9E">91.0</text>
  <text x="180" y="540" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">Last hidden:</text>
  <text x="360" y="540" font-family="monospace" font-size="12" fill="#FAFAFA">94.9</text>
  <text x="180" y="560" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">Second-to-last:</text>
  <text x="360" y="560" font-family="monospace" font-size="12" fill="#FAFAFA">95.6</text>
  <text x="180" y="580" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">Weighted sum last 4:</text>
  <text x="360" y="580" font-family="monospace" font-size="12" fill="#FAFAFA">95.9</text>
  <text x="180" y="600" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#FAFAFA">Concat last 4:</text>
  <text x="360" y="600" font-family="monospace" font-size="13" font-weight="bold" fill="#C62828">96.1</text>
  <text x="180" y="620" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">Weighted sum all 12:</text>
  <text x="360" y="620" font-family="monospace" font-size="12" fill="#FAFAFA">95.5</text>
  <!-- fine-tune result for comparison -->
  <text x="500" y="520" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9E9E9E">Fine-tune BASE: 96.4</text>
  <text x="500" y="540" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9E9E9E">Fine-tune LARGE: 96.6</text>
  <text x="500" y="570" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#C62828">Concat last 4 ≈ fine-tune BASE</text>
</svg>
